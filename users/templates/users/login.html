{% extends 'catalog/base.html' %}
{% block info %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Вход</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <p>Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}
