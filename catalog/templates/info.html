{% extends 'base.html' %}
{% load my_tags %}
{% block info %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-header py-3">
                    <!-- Теперь обращаемся напрямую к product -->
                    <h4 class="my-0 fw-normal">{{ product.name }}</h4>
                </div>
                <div class="card-body d-flex flex-column">
                    <h1 class="card-title pricing-card-title">{{ product.price }} руб
                        <small class="text-body-secondary fw-light">/кг</small>
                    </h1>

                    <img src="{{ product.photo | media }}" class="img-fluid">

                    <ul class="list-unstyled mt-3 mb-4">
                        <li><strong>Категория:{{ product.category }}</strong> </li>
                        <li class="mt-2">{{ product.description }}</li>
                    </ul>
<a href="{% url 'catalog:home' %}" class="w-100 btn btn-lg btn-primary mt-auto">Назад к списку</a>                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
