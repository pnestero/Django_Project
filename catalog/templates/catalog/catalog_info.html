{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block info %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-header py-3">
                    <h4 class="my-0 fw-normal">{{ object.name }}</h4>
                </div>
                <div class="card-body d-flex flex-column">
                    <h1 class="card-title pricing-card-title">{{ object.price }} руб
                        <small class="text-body-secondary fw-light">/кг</small>
                    </h1>

                    <img src="{{ object.photo | media }}" class="img-fluid">

                    <ul class="list-unstyled mt-3 mb-4">
                        <li><strong>Категория:{{ object.category }}</strong></li>
                        <li class="mt-2">{{ object.description }}</li>
                    </ul>

                    <!-- Кнопки редактирования и удаления (только для авторизованных) -->
                    {% if user.is_authenticated %}
                    <div class="mt-3 d-flex gap-2 justify-content-center">
                        <a href="{% url 'catalog:product_update' object.pk %}" class="btn btn-warning">Редактировать</a>
                        <a href="{% url 'catalog:product_delete' object.pk %}" class="btn btn-danger">Удалить</a>
                    </div>
                    {% endif %}

                    <a href="{% url 'catalog:home' %}" class="w-100 btn btn-lg btn-primary mt-auto">Назад к списку</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
